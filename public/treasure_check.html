  .img-box .fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:60px; background:#111; }
  .img-box img.broken { display:none; }

  .badge.rare      { background:#7df9ff; color:#000; }

  .card.flagged { background:#3a1a1a; border-color:#ff6b6b !important; }

const LAYER_NAMES = {
  1: { id:'l1', emoji:'🇰🇷', name:'동네 공사판' },
  2: { id:'l2', emoji:'🇰🇷', name:'학교 운동장' },
  3: { id:'l3', emoji:'🇰🇷', name:'아파트 화단' },
  4: { id:'l4', emoji:'🇰🇷', name:'찜질방 바닥' },
  5: { id:'l5', emoji:'🇰🇷', name:'군부대 훈련장' },
  6: { id:'l6', emoji:'🇰🇷', name:'아이돌 콘서트장 앞' },
};

// localStorage에 체크 상태 저장
const STORAGE_KEY = 'treasure_check_flagged';
const flagged = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

function saveFlagged() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...flagged]));
}

function render() {
  const container = document.getElementById('container');
  let html = '';
  for (let l = 1; l <= 6; l++) {
    const layerInfo = LAYER_NAMES[l];
    const items = TREASURES.filter(t => t.layer === l);
    html += `<section class="layer-section" id="${layerInfo.id}">
      <h2 class="layer-header">${layerInfo.emoji} layer_00${l} — ${layerInfo.name} (${items.length}장)</h2>
      <div class="grid">`;
    for (const t of items) {
      const isFlagged = flagged.has(t.id);
      html += `
        <div class="card ${t.rarity} ${isFlagged ? 'flagged' : ''}" data-id="${t.id}" data-name="${t.name}" data-desc="${t.desc}" data-rarity="${t.rarity}">
          <div class="img-box">
            <img src="assets/treasures/${t.id}.png" alt="${t.name}" onerror="this.classList.add('broken')">
            <div class="fallback">${t.emoji}</div>
          </div>
          <div class="id">${t.id}</div>
          <div class="name">${t.name}</div>
          <div class="meta">
            <span class="badge ${t.rarity}">${t.rarity}</span>
            <span class="emoji">${t.emoji}</span>
          </div>
          <div class="desc">${t.desc}</div>
          <div class="check-row">
            <label><input type="checkbox" class="flag-check" data-id="${t.id}" ${isFlagged ? 'checked' : ''}> ❌ 그림-이름 안 맞음</label>
          </div>
        </div>`;
    }
    html += `</div></section>`;
  }
  container.innerHTML = html;
  attachListeners();
  updateFlaggedSummary();
  applyFilters();
}

function attachListeners() {
  document.querySelectorAll('.flag-check').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const card = e.target.closest('.card');
      if (e.target.checked) {
        flagged.add(id);
        card.classList.add('flagged');
      } else {
        flagged.delete(id);
        card.classList.remove('flagged');
      }
      saveFlagged();
      updateFlaggedSummary();
      applyFilters();
    });
  });
}

function updateFlaggedSummary() {
  const summary = document.getElementById('flagged-summary');
  const list = document.getElementById('flagged-list');
  const count = document.getElementById('flagged-count');
  count.textContent = flagged.size;
  if (flagged.size === 0) {
    summary.classList.remove('show');
    return;
  }
  summary.classList.add('show');
  const sorted = [...flagged].sort();
  list.innerHTML = sorted.map(id => {
    const t = TREASURES.find(x => x.id === id);
    return `<div><code>${id}</code> — ${t ? t.name : '(unknown)'}</div>`;
  }).join('');
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const sorted = [...flagged].sort();
  const text = sorted.map(id => {
    const t = TREASURES.find(x => x.id === id);
    return `${id}\t${t ? t.name : ''}\t${t ? t.rarity : ''}`;
  }).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    const orig = btn.textContent;
    btn.textContent = '✓ 복사됨!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm(`체크된 ${flagged.size}개 보물 표시를 모두 해제할까요?`)) return;
  flagged.clear();
  saveFlagged();
  render();
});

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('filter-flagged').addEventListener('change', applyFilters);
document.getElementById('hide-common').addEventListener('change', applyFilters);

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const onlyFlagged = document.getElementById('filter-flagged').checked;
  const hideCommon = document.getElementById('hide-common').checked;
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const name = card.dataset.name.toLowerCase();
    const desc = card.dataset.desc.toLowerCase();
    const rarity = card.dataset.rarity;
    let show = true;
    if (q && !id.includes(q) && !name.includes(q) && !desc.includes(q)) show = false;
    if (onlyFlagged && !flagged.has(id)) show = false;
    if (hideCommon && rarity === 'common') show = false;
    card.classList.toggle('hidden', !show);
  });
}

render();
</script>
